// ============ PATCH FOR index.html (replace these 4 functions in the <script> block) ============

// 1) tierCard: REJECT now means "too close to call" (a pick still exists)
function tierCard(tier) {
  const label = tier === "REJECT" ? "TOO CLOSE" : (tier || "NO BET");
  return `<span class="tier tier-${tier || "REJECT"}">${label}</span>`;
}

// 2) renderAccaCard: shows expected value and labels rank 1 honestly
function renderAccaCard(a, rank) {
  const isBest = rank === 1;
  const legs = (a.legs || []).map((l, i) => `
    <div class="acca-leg">
      <div class="leg-num">${i+1}</div>
      <div class="leg-teams"><strong>${l.home} vs ${l.away}</strong><br/>
        <span style="color:var(--text2);font-size:11px">${l.league} · win prob ${(l.prob*100).toFixed(1)}%</span>
      </div>
      ${tierCard(l.tier)}
      <span style="font-size:12px;font-weight:600">${l.pick}</span>
      <span class="leg-odds">@ ${num(l.odds,2)}</span>
    </div>`).join("");
  return `
<div class="acca-card ${isBest?"best":""}">
  <div class="acca-header">
    <div>
      ${isBest ? '<div style="font-size:10px;color:var(--green);font-weight:600;margin-bottom:4px">★ SAFEST (HIGHEST PROBABILITY)</div>' : ""}
      <div class="acca-title">${a.n_legs}-leg Accumulator</div>
      <div class="acca-meta">Win prob: ${num(a.combined_model_prob,1)}% · EV: ${num(a.expected_value_pct,1)}%</div>
    </div>
    <div style="text-align:right">
      <div class="acca-odds">${num(a.combined_odds,2)}x</div>
      <div style="font-size:11px;color:var(--text2)">combined odds</div>
    </div>
  </div>
  ${legs}
</div>`;
}

// 3) runBatch: ONE request for the whole slate so accas are built across ALL fixtures
async function runBatch() {
  const raw = document.getElementById("batch-json").value.trim();
  if (!raw) { toast("Paste matches or JSON first", "error"); return; }
  const fixtures = parseAnyFormat(raw);
  if (!fixtures.length) { toast("No fixtures detected. Check input format.", "error"); return; }

  setLoading("batch-result", `Running ${fixtures.length} predictions…`);
  try {
    const data = await apiFetch("/predict/batch", {
      method: "POST",
      body: JSON.stringify({ fixtures }),
    });
    const preds = data.predictions || [];   // server returns them in the order sent
    const q = data.quality_counts || {};

    let html = `
<div class="stats-grid" style="margin-top:16px">
  <div class="stat-box"><div class="stat-box-val" style="color:var(--gold)">${data.total_fixtures}</div><div class="stat-box-label">Fixtures Predicted</div></div>
  <div class="stat-box"><div class="stat-box-val" style="color:var(--green)">${data.actionable_picks}</div><div class="stat-box-label">Confident Picks</div></div>
  <div class="stat-box"><div class="stat-box-val" style="color:var(--text3)">${data.no_bet_count}</div><div class="stat-box-label">Too Close To Call</div></div>
  <div class="stat-box"><div class="stat-box-val" style="color:var(--blue)">${data.acca_eligible_count}</div><div class="stat-box-label">Acca Eligible</div>
    <div class="stat-box-sub">market+rating ${q["market+rating"]||0} · market ${q["market"]||0} · prior ${q["prior"]||0}</div></div>
</div>`;

    if ((data.accumulators || []).length) {
      html += `<div class="section-title" style="margin:16px 0 12px">Accumulators (highest win probability first)</div>`;
      data.accumulators.forEach((a, i) => { html += renderAccaCard(a, i + 1); });
    } else {
      html += `<div class="card" style="color:var(--text2)">No accumulator: fewer than 2 fixtures had odds plus a win probability of 60% or more.</div>`;
    }

    html += `<div class="section-title" style="margin:20px 0 12px">All Match Predictions (order as provided)</div>`;
    preds.forEach((p, idx) => { html += renderPredCard(p, idx + 1); });

    document.getElementById("batch-result").innerHTML = html;
    toast(`Predicted ${data.total_fixtures} fixtures`);
  } catch (e) {
    document.getElementById("batch-result").innerHTML =
      `<div class="card" style="border-color:var(--red)">${e.message}</div>`;
    toast(e.message, "error");
  }
}

// 4) checkHealth: fill the "Model & Data Sources" stat boxes from the real /health response
async function checkHealth() {
  const dot = document.getElementById("statusDot");
  const txt = document.getElementById("statusText");
  document.getElementById("apiUrlBadge").textContent = API_BASE.replace("https://","");
  try {
    const h = await apiFetch("/health");
    dot.style.background = "var(--green)";
    txt.textContent = h.clubelo && h.clubelo.clubs_loaded ? `Engine Online · ${h.clubelo.clubs_loaded} club ratings` : "Engine Online · ratings NOT loaded";
    const pb = document.getElementById("pb-status"), sd = document.getElementById("sd-status");
    if (pb) { pb.textContent = h.components.penaltyblog ? "✓ Active" : "✗ Not used"; pb.style.color = h.components.penaltyblog ? "var(--green)" : "var(--text3)"; }
    if (sd) { sd.textContent = h.components.soccerdata ? "✓ Active" : "✗ Not used"; sd.style.color = h.components.soccerdata ? "var(--green)" : "var(--text3)"; }
    return h;
  } catch {
    dot.style.background = "var(--red)";
    txt.textContent = "Backend Offline";
  }
  return null;
}
